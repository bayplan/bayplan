# OpenAPI specification of the panel. Served at GET /api/openapi.json (see openapi.go).
# Maintained by hand; when adding a route meant for scripts, add it here.
openapi: 3.0.3
info:
  title: Bayplan API
  version: '1'
  description: 'Bayplan API, the same one the frontend uses. Authentication: session cookie (browser) or personal API
    token in `Authorization: Bearer bpl_…` (scripts, CI). A token acts with the permissions of its user; with `readOnly`
    it is capped to readonly on every cluster. Errors from the cluster API server are returned verbatim with 502.'
servers:
- url: /
tags:
- name: Auth
- name: Instance
- name: Clusters
- name: Cloud
- name: Resources
- name: Writes
- name: Helm
- name: GitOps
- name: Registries
- name: Extensions
- name: Docker
- name: Notifications
- name: Users
- name: Backups
- name: Audit
- name: WebSocket
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: bayplan_session
    bearerAuth:
      type: http
      scheme: bearer
      description: Personal API token (bpl_…), created under Profile → API tokens.
  schemas:
    ClusterInput:
      type: object
      properties:
        displayName:
          type: string
        description:
          type: string
        connector:
          type: string
          enum:
          - direct
          - agent
          - cloud
        kind:
          type: string
          enum:
          - kubernetes
          - docker
        kubeconfig:
          type: string
        apiEndpoint:
          type: string
        caCert:
          type: string
        saToken:
          type: string
        clientCert:
          type: string
        clientKey:
          type: string
        insecureSkipTLSVerify:
          type: boolean
        cloudCredentialId:
          type: integer
        cloudRef:
          type: object
    NamespaceQuotaInput:
      type: object
      properties:
        createNamespace:
          type: boolean
        requestsCpu:
          type: string
        requestsMemory:
          type: string
        limitsCpu:
          type: string
        limitsMemory:
          type: string
        pods:
          type: string
        persistentVolumeClaims:
          type: string
        requestsStorage:
          type: string
        defaultRequestCpu:
          type: string
        defaultRequestMemory:
          type: string
        defaultLimitCpu:
          type: string
        defaultLimitMemory:
          type: string
        maxCpu:
          type: string
        maxMemory:
          type: string
        dryRun:
          type: boolean
paths:
  /api/auth/status:
    get:
      tags:
      - Auth
      summary: Initial setup status
      description: No authentication.
      responses:
        '200':
          description: OK
  /api/auth/setup:
    post:
      tags:
      - Auth
      summary: Initial admin setup with the one-time token
      description: No authentication.
      responses:
        '200':
          description: OK
      requestBody:
        content:
          application/json:
            schema:
              type: object
  /api/auth/login:
    post:
      tags:
      - Auth
      summary: Local login (session cookie + CSRF cookie)
      description: No authentication.
      responses:
        '200':
          description: OK
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username: {}
  /api/auth/logout:
    post:
      tags:
      - Auth
      summary: Log out
      description: Any signed-in user. With a cookie, requires the X-CSRF-Token header (value of the bayplan_csrf
        cookie); not with an API token.
      responses:
        '200':
          description: OK
        '401':
          description: No session
        '403':
          description: Forbidden
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
  /api/auth/me:
    get:
      tags:
      - Auth
      summary: Current user, global role and preferences
      description: Any signed-in user.
      responses:
        '200':
          description: OK
        '401':
          description: No session
        '403':
          description: Forbidden
      security:
      - cookieAuth: []
      - bearerAuth: []
  /api/auth/change-password:
    post:
      tags:
      - Auth
      summary: Change the current user's password
      description: Any signed-in user. With a cookie, requires the X-CSRF-Token header (value of the bayplan_csrf
        cookie); not with an API token.
      responses:
        '200':
          description: OK
        '401':
          description: No session
        '403':
          description: Forbidden
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                currentPassword: {}
  /api/auth/profile:
    patch:
      tags:
      - Auth
      summary: Edit display name and email
      description: Any signed-in user. With a cookie, requires the X-CSRF-Token header (value of the bayplan_csrf
        cookie); not with an API token.
      responses:
        '200':
          description: OK
        '401':
          description: No session
        '403':
          description: Forbidden
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
  /api/auth/preferences:
    patch:
      tags:
      - Auth
      summary: Partial merge of preferences (free-form JSON)
      description: Any signed-in user. With a cookie, requires the X-CSRF-Token header (value of the bayplan_csrf
        cookie); not with an API token.
      responses:
        '200':
          description: OK
        '401':
          description: No session
        '403':
          description: Forbidden
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
  /api/auth/oidc/login:
    get:
      tags:
      - Auth
      summary: Start the OIDC flow (redirects to the provider)
      description: No authentication.
      responses:
        '200':
          description: OK
  /api/auth/oidc/callback:
    get:
      tags:
      - Auth
      summary: OIDC callback
      description: No authentication.
      responses:
        '200':
          description: OK
  /api/clusters/{id}/explain:
    post:
      tags:
      - AI
      summary: 'Explain an object with the configured AI provider ({kind, namespace, name, lang})'
      description: The configured minimum role on cluster {id} (editor by default); CSRF with a cookie session. Sends the object's YAML (env values, Secret data and managedFields removed), its recent events and the troubled container's last log lines, with secret-looking text scrubbed. Never the panel's own namespace. Counted against the per-user daily limit (fails closed) and audited as ai.explain.
      responses:
        '200':
          description: OK ({text, provider, model, sent, inputTokens, outputTokens, durationMs, remainingToday})
        '403':
          description: Role below the configured minimum, or the panel's namespace
        '409':
          description: AI not configured
        '429':
          description: Daily limit reached
        '502':
          description: The provider failed (its message is returned)
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
  /api/assistant/chat:
    post:
      tags:
      - AI
      summary: 'In-panel AI assistant: one question with the whole conversation ({messages, clusterId?, namespaces?, lang}), answer streamed as NDJSON events'
      description: Read-only. The model only gets the MCP read tools, run through this API with the caller's session; each cluster or namespace it touches must pass the configured AI minimum role and is never the panel's own namespace. Tool output is redacted like Explain. Nothing is stored; each question counts against the daily AI limit and is audited as ai.assistant. Events are tool, tool_error, note, answer, done and error.
      responses:
        '200':
          description: application/x-ndjson stream of events
        '409':
          description: AI not configured
        '429':
          description: Daily limit reached
      security:
      - cookieAuth: []
      - bearerAuth: []
  /api/ai/status:
    get:
      tags:
      - AI
      summary: Whether Explain is available, with which provider/model and minimum role
      responses:
        '200':
          description: OK
      security:
      - cookieAuth: []
      - bearerAuth: []
  /api/settings/ai/test:
    post:
      tags:
      - AI
      summary: Test the saved AI configuration with a one-line prompt (global admin)
      responses:
        '200':
          description: OK ({ok, latencyMs, reply})
        '422':
          description: The provider failed ({ok:false, error})
      security:
      - cookieAuth: []
      - bearerAuth: []
  /api/mcp:
    post:
      tags:
      - MCP
      summary: Model Context Protocol server (Streamable HTTP, JSON-RPC 2.0) for AI clients
      description: 'API tokens only (Authorization: Bearer). Methods initialize, ping, tools/list, tools/call. Every tool calls this same API with the caller''s token, so RBAC, read-only tokens and audit apply (writes are audited with detail.via=mcp). A read-only token only lists the read tools; apply_manifest requires a prior dry-run of the same YAML.'
      responses:
        '200':
          description: JSON-RPC response
        '202':
          description: Notification accepted (no body)
        '401':
          description: No token (cookie sessions are not accepted)
        '403':
          description: Request from a browser (Origin header)
      security:
      - bearerAuth: []
  /api/auth/tokens:
    get:
      tags:
      - Auth
      summary: List my API tokens (never the value)
      description: Browser session (cookie) only, not an API token.
      responses:
        '200':
          description: OK
        '401':
          description: No session
        '403':
          description: Forbidden
      security:
      - cookieAuth: []
      - bearerAuth: []
    post:
      tags:
      - Auth
      summary: Create an API token; the value is returned ONCE
      description: Browser session (cookie) only, not an API token. With a cookie, requires the X-CSRF-Token header
        (value of the bayplan_csrf cookie); not with an API token.
      responses:
        '200':
          description: OK
        '401':
          description: No session
        '403':
          description: Forbidden
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {}
  /api/auth/tokens/{id}:
    delete:
      tags:
      - Auth
      summary: Revoke an API token
      description: Browser session (cookie) only, not an API token. With a cookie, requires the X-CSRF-Token header
        (value of the bayplan_csrf cookie); not with an API token.
      responses:
        '200':
          description: OK
        '401':
          description: No session
        '403':
          description: Forbidden
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
  /api/settings:
    get:
      tags:
      - Instance
      summary: Instance settings (secrets masked)
      description: Global admin, or admin on cluster {id} on cluster routes.
      responses:
        '200':
          description: OK
        '401':
          description: No session
        '403':
          description: Forbidden
      security:
      - cookieAuth: []
      - bearerAuth: []
  /api/settings/{key}:
    put:
      tags:
      - Instance
      summary: 'Save a section: server | auth.oidc | smtp | costs'
      description: Global admin, or admin on cluster {id} on cluster routes. With a cookie, requires the X-CSRF-Token
        header (value of the bayplan_csrf cookie); not with an API token.
      responses:
        '200':
          description: OK
        '401':
          description: No session
        '403':
          description: Forbidden
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
  /api/openapi.json:
    get:
      tags:
      - Instance
      summary: This specification
      description: Any signed-in user.
      responses:
        '200':
          description: OK
        '401':
          description: No session
        '403':
          description: Forbidden
      security:
      - cookieAuth: []
      - bearerAuth: []
  /healthz:
    get:
      tags:
      - Instance
      summary: Liveness
      description: No authentication.
      responses:
        '200':
          description: OK
  /readyz:
    get:
      tags:
      - Instance
      summary: Readiness (503 if the database does not respond)
      description: No authentication.
      responses:
        '200':
          description: OK
  /metrics:
    get:
      tags:
      - Instance
      summary: Prometheus metrics
      description: No authentication.
      responses:
        '200':
          description: OK
  /api/clusters:
    get:
      tags:
      - Clusters
      summary: Clusters visible to the user, with connection status and effective role
      description: Any signed-in user.
      responses:
        '200':
          description: OK
        '401':
          description: No session
        '403':
          description: Forbidden
      security:
      - cookieAuth: []
      - bearerAuth: []
    post:
      tags:
      - Clusters
      summary: 'Register a cluster: direct (kubeconfig/token/certificate), agent or cloud'
      description: Global admin, or admin on cluster {id} on cluster routes. With a cookie, requires the X-CSRF-Token
        header (value of the bayplan_csrf cookie); not with an API token.
      responses:
        '200':
          description: OK
        '401':
          description: No session
        '403':
          description: Forbidden
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterInput'
  /api/clusters/{id}:
    patch:
      tags:
      - Clusters
      summary: Edit name, description, enabled, or rotate credentials
      description: Global admin, or admin on cluster {id} on cluster routes. With a cookie, requires the X-CSRF-Token
        header (value of the bayplan_csrf cookie); not with an API token.
      responses:
        '200':
          description: OK
        '401':
          description: No session
        '403':
          description: Forbidden
        '503':
          description: Cluster not synced or kind unavailable (the body carries the reason)
        '502':
          description: Cluster API server error, verbatim (RBAC, admission…)
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    delete:
      tags:
      - Clusters
      summary: Delete a cluster and its role assignments
      description: Global admin, or admin on cluster {id} on cluster routes. With a cookie, requires the X-CSRF-Token
        header (value of the bayplan_csrf cookie); not with an API token.
      responses:
        '200':
          description: OK
        '401':
          description: No session
        '403':
          description: Forbidden
        '503':
          description: Cluster not synced or kind unavailable (the body carries the reason)
        '502':
          description: Cluster API server error, verbatim (RBAC, admission…)
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
  /api/clusters/{id}/agent/manifest:
    post:
      tags:
      - Clusters
      summary: Regenerate the agent manifest URL
      description: Global admin, or admin on cluster {id} on cluster routes. With a cookie, requires the X-CSRF-Token
        header (value of the bayplan_csrf cookie); not with an API token.
      responses:
        '200':
          description: OK
        '401':
          description: No session
        '403':
          description: Forbidden
        '503':
          description: Cluster not synced or kind unavailable (the body carries the reason)
        '502':
          description: Cluster API server error, verbatim (RBAC, admission…)
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
  /api/agent/manifest/{id}/{token}:
    get:
      tags:
      - Clusters
      summary: Agent manifest (no session, 1 h token)
      description: No authentication.
      responses:
        '200':
          description: OK
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      - name: token
        in: path
        required: true
        schema:
          type: string
  /api/clusters/{id}/cloud/rbac:
    get:
      tags:
      - Clusters
      summary: RBAC to apply on a cloud cluster
      description: Global admin, or admin on cluster {id} on cluster routes.
      responses:
        '200':
          description: OK
        '401':
          description: No session
        '403':
          description: Forbidden
        '503':
          description: Cluster not synced or kind unavailable (the body carries the reason)
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
  /api/clusters/{id}/kinds:
    get:
      tags:
      - Clusters
      summary: Optional kinds available in the cluster and the reason if any is missing
      description: Readonly role or higher on cluster {id}.
      responses:
        '200':
          description: OK
        '401':
          description: No session
        '403':
          description: Forbidden
        '503':
          description: Cluster not synced or kind unavailable (the body carries the reason)
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
  /api/clusters/{id}/summary:
    get:
      tags:
      - Clusters
      summary: Short cluster summary
      description: Readonly role or higher on cluster {id}.
      responses:
        '200':
          description: OK
        '401':
          description: No session
        '403':
          description: Forbidden
        '503':
          description: Cluster not synced or kind unavailable (the body carries the reason)
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
  /api/clusters/{id}/overview:
    get:
      tags:
      - Clusters
      summary: 'Overview: counters, reserved capacity, issues, Warning events'
      description: Readonly role or higher on cluster {id}.
      responses:
        '200':
          description: OK
        '401':
          description: No session
        '403':
          description: Forbidden
        '503':
          description: Cluster not synced or kind unavailable (the body carries the reason)
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
  /api/clusters/{id}/topology:
    get:
      tags:
      - Clusters
      summary: 'Topology graph: Ingress -> Service -> workload -> pods -> PVC, with status per node'
      description: Readonly role or higher on cluster {id}. Configured relations only (owner, selector, route, volume), not observed traffic. Above 3000 nodes the response is empty with tooLarge=true.
      responses:
        '200':
          description: OK
        '401':
          description: No session
        '403':
          description: Forbidden
        '503':
          description: Cluster not synced (the body carries the reason)
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      - name: namespace
        in: query
        required: false
        description: Comma-separated namespaces; all if empty
        schema:
          type: string
  /api/clusters/{id}/pods/{namespace}/{name}/logs:
    get:
      tags:
      - Clusters
      summary: Last lines of a pod container's log (no follow; the UI follows over WebSocket)
      description: Readonly role or higher on cluster {id}. Impersonated with the role on the cluster, the panel's own namespace is refused, and the read is audited (pod.logs.read).
      responses:
        '200':
          description: OK ({logs, truncated, tailLines})
        '401':
          description: No session
        '403':
          description: Forbidden
        '502':
          description: The cluster's API server refused it (the body says why)
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      - name: namespace
        in: path
        required: true
        schema:
          type: string
      - name: name
        in: path
        required: true
        schema:
          type: string
      - name: container
        in: query
        required: false
        schema:
          type: string
      - name: tailLines
        in: query
        required: false
        description: 1-2000, default 200
        schema:
          type: integer
      - name: previous
        in: query
        required: false
        description: Logs of the previous container run
        schema:
          type: boolean
  /api/clusters/{id}/metrics:
    get:
      tags:
      - Clusters
      summary: Actual usage (metrics-server) per node and total; available=false without metrics-server
      description: Readonly role or higher on cluster {id}.
      responses:
        '200':
          description: OK
        '401':
          description: No session
        '403':
          description: Forbidden
        '503':
          description: Cluster not synced or kind unavailable (the body carries the reason)
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
  /api/clusters/{id}/metrics/pods:
    get:
      tags:
      - Clusters
      summary: Actual usage per pod and container versus requests/limits
      description: Readonly role or higher on cluster {id}.
      responses:
        '200':
          description: OK
        '401':
          description: No session
        '403':
          description: Forbidden
        '503':
          description: Cluster not synced or kind unavailable (the body carries the reason)
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      - name: namespace
        in: query
        required: false
        schema:
          type: string
        description: Comma-separated list; empty = all.
  /api/fleet/attention:
    get:
      tags:
      - Clusters
      summary: Issues across all visible clusters
      description: Any signed-in user.
      responses:
        '200':
          description: OK
        '401':
          description: No session
        '403':
          description: Forbidden
      security:
      - cookieAuth: []
      - bearerAuth: []
  /api/cloud/credentials:
    get:
      tags:
      - Cloud
      summary: Cloud credentials (without secrets)
      description: Global admin, or admin on cluster {id} on cluster routes.
      responses:
        '200':
          description: OK
        '401':
          description: No session
        '403':
          description: Forbidden
      security:
      - cookieAuth: []
      - bearerAuth: []
    post:
      tags:
      - Cloud
      summary: Create a cloud credential (validated against the provider)
      description: Global admin, or admin on cluster {id} on cluster routes. With a cookie, requires the X-CSRF-Token
        header (value of the bayplan_csrf cookie); not with an API token.
      responses:
        '200':
          description: OK
        '401':
          description: No session
        '403':
          description: Forbidden
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {}
  /api/cloud/credentials/{id}:
    patch:
      tags:
      - Cloud
      summary: Edit a cloud credential
      description: Global admin, or admin on cluster {id} on cluster routes. With a cookie, requires the X-CSRF-Token
        header (value of the bayplan_csrf cookie); not with an API token.
      responses:
        '200':
          description: OK
        '401':
          description: No session
        '403':
          description: Forbidden
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    delete:
      tags:
      - Cloud
      summary: Delete a cloud credential (409 if it has clusters)
      description: Global admin, or admin on cluster {id} on cluster routes. With a cookie, requires the X-CSRF-Token
        header (value of the bayplan_csrf cookie); not with an API token.
      responses:
        '200':
          description: OK
        '401':
          description: No session
        '403':
          description: Forbidden
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
  /api/cloud/credentials/{id}/clusters:
    get:
      tags:
      - Cloud
      summary: Discover the credential's EKS/AKS/GKE clusters
      description: Global admin, or admin on cluster {id} on cluster routes.
