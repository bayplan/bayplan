# Technical ServiceAccount that Bayplan uses to connect to a managed cluster.
# Read-only permissions over the resources the panel shows (the informer
# cache), plus "impersonate": every write (restart, scale, apply, delete,
# exec…) is sent impersonating the real Bayplan user and one of the bayplan:*
# groups, so Kubernetes authorizes it with that group's ClusterRole below and
# its native audit log records who acted. The SA itself writes nothing.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bayplan-technical
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bayplan-technical
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "nodes", "namespaces", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # pods/exec is redundant here (the identity Kubernetes actually authorizes in
  # an impersonated request is the impersonated one, not the SA — see
  # bayplan-impersonated-admin below), but it is kept for consistency with
  # pods/log: if some day the SA is used without impersonation, it still
  # works.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  # Read-only: restart/scale/rollback go impersonated (bayplan-impersonated-
  # editor/-admin carry those verbs). replicasets is not shown as such in the
  # UI; it is needed to resolve pod -> deployment, which in Kubernetes always
  # goes through the intermediate ReplicaSet.
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  # Secondary kinds (OPTIONAL informers in the backend): if any of these
  # permissions is missing, only its listing responds 503 — the rest of the
  # cluster keeps working. Secrets are cached whole, but the panel only returns
  # their values to whoever has the admin role on the cluster (and audits it).
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "serviceaccounts", "persistentvolumeclaims", "persistentvolumes", "resourcequotas", "limitranges"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  # Real CPU/memory consumption (metrics-server). Optional: without this
  # permission or without metrics-server the panel shows only what is reserved
  # and says why.
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
  # Helm reads (listing releases, history) go through this SA and read the
  # release Secrets (owner=helm): covered by the secrets permission above. Helm
  # writes are impersonated (see below).
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bayplan-technical
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bayplan-technical
subjects:
  - kind: ServiceAccount
    name: bayplan-technical
    namespace: kube-system
---
# Lets the technical SA impersonate identities. The username
# (bayplan:<username>, see internal/k8s/actions.go) is dynamic and RBAC does
# not support wildcards/prefixes in resourceNames, so that permission is
# necessarily left open — the mitigation is that the impersonated username,
# by itself, has NO ClusterRoleBinding of its own and therefore grants no
# permissions (see below).
#
# The group CAN and MUST be restricted: without this resourceNames, the
# technical SA could impersonate "system:masters" (cluster superadmin) or any
# other privileged group, not just the ones Bayplan uses. It is the cheapest
# and highest-impact mitigation on this ClusterRole.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bayplan-impersonator
rules:
  - apiGroups: [""]
    resources: ["users"]
    verbs: ["impersonate"]
  - apiGroups: [""]
    resources: ["groups"]
    verbs: ["impersonate"]
    resourceNames: ["bayplan:admins", "bayplan:editors", "bayplan:readonly"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bayplan-impersonator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bayplan-impersonator
subjects:
  - kind: ServiceAccount
    name: bayplan-technical
    namespace: kube-system
---
# IMPORTANT: Kubernetes authorizes an impersonated request with the RBAC of
# the IMPERSONATED identity, not with the technical ServiceAccount's. That is
# why the impersonated user (bayplan:<username>, only for traceability in the
# native audit log) is ALWAYS impersonated together with one of these three
# groups, which do carry real permissions (panel rbac.Role -> group):
#   - bayplan:admins   -> everything editors have + deleting resources,
#                         draining nodes, terminal (pods/exec) and reading
#                         secret values
#   - bayplan:editors  -> operating workloads: restart/scale/rollback,
#                         applying YAML (server-side apply) of the kinds the
#                         panel manages, cordon/uncordon of nodes, logs
#   - bayplan:readonly -> only reading logs (see pods/log)
# Without this group binding, every impersonated action returns 403 even if
# the technical ServiceAccount has the "impersonate" permission.
#
# pods/exec (interactive terminal) and delete are deliberately admin-only: an
# editor can deploy and scale, but not run arbitrary commands inside the
# containers nor destroy resources. Extending what an editor can apply (e.g.
# custom CRDs) means adding rules here; the panel passes the YAML as-is and
# the API server decides.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bayplan-impersonated-editor
rules:
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Server-side apply needs get+patch (and create for new objects). No
  # delete: that belongs to admins.
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "secrets", "serviceaccounts", "persistentvolumeclaims", "namespaces", "resourcequotas", "limitranges"]
    verbs: ["get", "list", "create", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "create", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "create", "patch", "update"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "create", "patch", "update"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "create", "patch", "update"]
  # cordon/uncordon = patch of spec.unschedulable.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "patch"]
  # Helm install/upgrade/rollback: the release state lives in Secrets (create,
  # update and, on rollback, mark as superseded); the chart may bring any of
  # the kinds above. A chart with its own RBAC/CRDs fails for an editor with
  # the cluster's 403: add here whatever you want to allow.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bayplan-impersonated-editor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bayplan-impersonated-editor
subjects:
  - kind: Group
    name: "bayplan:editors"
    apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bayplan-impersonated-admin
rules:
  # Everything the editor has…
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "secrets", "serviceaccounts", "persistentvolumeclaims", "namespaces", "resourcequotas", "limitranges"]
    verbs: ["get", "list", "create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "create", "patch", "update", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "create", "patch", "update", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "create", "patch", "update", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "create", "patch", "update", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "create", "patch", "update", "delete"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "create", "patch", "update", "delete"]
  # …plus what is admin-only: nodes (cordon and drain), pod eviction honoring
  # PodDisruptionBudgets, logs and terminal.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "patch"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  # …and what is needed to install metrics-server from the panel (its
  # components.yaml brings ClusterRoles, bindings to system:auth-delegator and
  # an APIService). Kubernetes forbids creating a role with permissions one
  # does not hold, hence watch on pods/nodes/configmaps, nodes/metrics and the
  # authentication reviews are here too: they are the rules of
  # system:metrics-server and system:auth-delegator, and without them the apply
  # fails with "escalate".
  # Scoped by name to the metrics-server objects: a panel admin cannot touch
  # anyone else's RBAC or APIServices. `create` does not accept resourceNames
  # (the name is not known at authorization time) and server-side apply
  # requires it when creating; Kubernetes' escalation protection already
  # forbids creating a role or binding with permissions one does not hold. No
  # `delete`: installing deletes nothing.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings", "rolebindings"]
    verbs: ["create"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    resourceNames: ["system:aggregated-metrics-reader", "system:metrics-server"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings"]
    resourceNames: ["metrics-server:system:auth-delegator", "system:metrics-server"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    resourceNames: ["metrics-server-auth-reader"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apiregistration.k8s.io"]
    resources: ["apiservices"]
    verbs: ["create"]
  - apiGroups: ["apiregistration.k8s.io"]
    resources: ["apiservices"]
    resourceNames: ["v1beta1.metrics.k8s.io"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods", "nodes", "configmaps"]
    verbs: ["watch"]
  - apiGroups: [""]
    resources: ["nodes/metrics"]
    verbs: ["get"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bayplan-impersonated-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bayplan-impersonated-admin
subjects:
  - kind: Group
    name: "bayplan:admins"
    apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bayplan-impersonated-readonly
rules:
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bayplan-impersonated-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bayplan-impersonated-readonly
subjects:
  - kind: Group
    name: "bayplan:readonly"
    apiGroup: rbac.authorization.k8s.io
