apiVersion: v2
name: bayplan
description: Lightweight, self-hosted multi-cluster Kubernetes management. One binary (Go + React) plus Postgres.
type: application
version: 0.1.3
appVersion: "0.1.3"
keywords: [kubernetes, multi-cluster, dashboard, helm, gitops]
home: https://github.com/bayplan/bayplan
sources:
  - https://github.com/bayplan/bayplan
icon: https://raw.githubusercontent.com/bayplan/bayplan/main/docs/brand/bayplan-icon.svg
maintainers:
  - name: The Bayplan Authors
    url: https://github.com/bayplan
annotations:
  # Artifact Hub metadata. The two Bayplan image tags are rewritten to the
  # release version by CI when it packages the chart (they are the appVersion);
  # keep the Postgres one equal to postgresql.image in values.yaml.
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: monitoring-logging
  artifacthub.io/prerelease: "false"
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/images: |
    - name: bayplan
      image: ghcr.io/bayplan/bayplan:0.1.3
    - name: bayplan-agent
      image: ghcr.io/bayplan/bayplan-agent:0.1.3
    - name: postgres
      image: docker.io/library/postgres:18.6-alpine3.24
  artifacthub.io/changes: |
    - kind: security
      description: "Backend and agent: golang.org/x/net 0.62.0 (CVE-2026-78661) and Go dependencies updated (go-jose 4.1.9, pgx 5.13, goose 3.30, x/crypto 0.59, AWS SDK)."
    - kind: security
      description: "Frontend: npm dependencies updated (axios 1.21.1, vite 8.3.8 and others)."
    - kind: security
      description: "Images: Trivy 0.76.2 (drops the CVE-2026-116587 exception), Node 24.22.3 build stage and Alpine 3.24.4."
    - kind: security
      description: "Image scan: the exceptions for the bundled kubectl v1.37.2 are reduced to the three CVEs that still apply and extended until 2026-12-31."
  artifacthub.io/links: |
    - name: Website
      url: https://bayplan.io
    - name: Deployment guide
      url: https://github.com/bayplan/bayplan/blob/main/deploy/README.md
    - name: Changelog
      url: https://github.com/bayplan/bayplan/blob/main/CHANGELOG.md
    - name: Report a vulnerability
      url: https://github.com/bayplan/bayplan/security/advisories/new
