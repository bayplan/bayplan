apiVersion: v2
name: bayplan
description: Lightweight, self-hosted multi-cluster Kubernetes management. One binary (Go + React) plus Postgres.
type: application
version: 0.1.2
appVersion: "0.1.2"
keywords: [kubernetes, multi-cluster, dashboard, helm, gitops]
home: https://github.com/bayplan/bayplan
sources:
  - https://github.com/bayplan/bayplan
icon: https://raw.githubusercontent.com/bayplan/bayplan/main/docs/brand/bayplan-icon.svg
maintainers:
  - name: The Bayplan Authors
    url: https://github.com/bayplan
annotations:
  # Artifact Hub metadata. The two Bayplan image tags are rewritten to the
  # release version by CI when it packages the chart (they are the appVersion);
  # keep the Postgres one equal to postgresql.image in values.yaml.
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: monitoring-logging
  artifacthub.io/prerelease: "false"
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/images: |
    - name: bayplan
      image: ghcr.io/bayplan/bayplan:0.1.2
    - name: bayplan-agent
      image: ghcr.io/bayplan/bayplan-agent:0.1.2
    - name: postgres
      image: docker.io/library/postgres:18.6-alpine3.24
  artifacthub.io/changes: |
    - kind: security
      description: "Frontend: follow-redirects 1.16.2 (GHSA-mrwp-f3q8-3g9p)."
    - kind: security
      description: "Backend: Go dependencies updated (Kubernetes client 0.37.2, AWS SDK); govulncheck reports no reachable vulnerabilities."
    - kind: security
      description: "Images: Node 24.22.2 build stage and kubectl v1.37.2 for the web shell."
  artifacthub.io/links: |
    - name: Website
      url: https://bayplan.io
    - name: Deployment guide
      url: https://github.com/bayplan/bayplan/blob/main/deploy/README.md
    - name: Changelog
      url: https://github.com/bayplan/bayplan/blob/main/CHANGELOG.md
    - name: Report a vulnerability
      url: https://github.com/bayplan/bayplan/security/advisories/new
