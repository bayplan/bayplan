{{- $fullname := include "bayplan.fullname" . -}}
{{- if not .Values.existingEncryptionSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-encryption
  labels:
    {{- include "bayplan.labels" . | nindent 4 }}
  annotations:
    # Keep on uninstall: without the key, a DB restore is useless.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- $given := .Values.encryptionKey }}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-encryption" $fullname) }}
  {{- if and $existing (index $existing.data "encryptionKey") }}
  encryptionKey: {{ index $existing.data "encryptionKey" | b64dec | quote }}
  {{- else if $given }}
  encryptionKey: {{ $given | quote }}
  {{- else }}
  encryptionKey: {{ randBytes 32 | quote }}
  {{- end }}
{{- end }}
---
{{- if and .Values.postgresql.enabled (not .Values.existingDatabaseSecret) }}
{{- $pw := include "bayplan.stableSecretValue" (list . (printf "%s-db" $fullname) "password" .Values.postgresql.password) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-db
  labels:
    {{- include "bayplan.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  password: {{ $pw | quote }}
  {{- /* urlquery: a given password with @ : / ? # would otherwise break the URL. */}}
  databaseURL: {{ printf "postgres://bayplan:%s@%s-db:5432/bayplan?sslmode=disable" ($pw | urlquery) $fullname | quote }}
{{- else if and (not .Values.postgresql.enabled) (not .Values.existingDatabaseSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-db
  labels:
    {{- include "bayplan.labels" . | nindent 4 }}
type: Opaque
stringData:
  databaseURL: {{ required "externalDatabaseURL or existingDatabaseSecret is required with postgresql.enabled=false" .Values.externalDatabaseURL | quote }}
{{- end }}
---
{{- /* Initial admin password (BOOTSTRAP_PASSWORD), generated if not given and
kept across upgrades; only read on the first start. */}}
{{- if and .Values.bootstrapPassword (lt (len .Values.bootstrapPassword) 12) }}
{{- fail "bootstrapPassword must be at least 12 characters (the server would refuse it on start)" }}
{{- end }}
{{- $bootstrap := include "bayplan.stableSecretValue" (list . (printf "%s-bootstrap" $fullname) "bootstrapPassword" .Values.bootstrapPassword) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-bootstrap
  labels:
    {{- include "bayplan.labels" . | nindent 4 }}
type: Opaque
stringData:
  bootstrapPassword: {{ $bootstrap | quote }}
