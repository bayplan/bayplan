{{- if .Values.postgresql.enabled -}}
{{- $fullname := include "bayplan.fullname" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-db
  labels:
    {{- include "bayplan.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  clusterIP: None
  ports:
    - name: postgres
      port: 5432
  selector:
    {{- include "bayplan.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: database
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}-db
  labels:
    {{- include "bayplan.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  serviceName: {{ $fullname }}-db
  replicas: 1
  selector:
    matchLabels:
      {{- include "bayplan.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        {{- include "bayplan.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: database
    spec:
      # uid/gid 70 is the postgres user of the alpine image. Started as that
      # user the entrypoint skips its root-only chown step, and fsGroup makes
      # the volume writable for initdb.
      securityContext:
        fsGroup: 70
        runAsUser: 70
        runAsGroup: 70
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ include "bayplan.withRegistry" (list . .Values.postgresql.image) }}
          env:
            - name: POSTGRES_DB
              value: bayplan
            - name: POSTGRES_USER
              value: bayplan
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-db" $fullname) .Values.existingDatabaseSecret }}
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "bayplan", "-d", "bayplan"]
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.postgresql.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.storage }}
{{- end }}
