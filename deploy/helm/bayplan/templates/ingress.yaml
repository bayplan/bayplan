{{- if .Values.ingress.enabled -}}
{{- $fullname := include "bayplan.fullname" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "bayplan.labels" . | nindent 4 }}
  annotations:
    # Agents and the terminal use long-lived WebSockets: the ingress must
    # not cut them off for inactivity. ingress-nginx only; other controllers
    # need their own setting (see ingress.annotations in values.yaml).
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    {{- if .Values.ingress.tls.enabled }}
    {{- if eq .Values.ingress.tls.source "letsEncrypt" }}
    cert-manager.io/issuer: {{ $fullname }}-letsencrypt
    {{- else if eq .Values.ingress.tls.source "selfSigned" }}
    cert-manager.io/issuer: {{ $fullname }}-ca
    {{- end }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ include "bayplan.tlsSecretName" . }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}
                port:
                  name: http
{{- end }}
