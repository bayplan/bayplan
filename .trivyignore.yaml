# Vulnerabilities accepted on purpose by the image scans (CI and the weekly
# security-scan workflow). Every entry carries WHY, the binary it applies to
# (paths) and an expiry date: when it expires the scan fails again, so an
# exception cannot be forgotten.
vulnerabilities:
  # kubectl v1.37.2 is the latest stable release and was built upstream with
  # x/net 0.57 / x/text 0.40: there is nothing newer to pin. In the image it
  # only runs the web shell's commands against the local proxy
  # (internal/kubectl). Remove when a kubectl release built with x/net >= 0.62
  # and x/text >= 0.41 is out and bump KUBECTL_VERSION.
  - id: CVE-2026-78661
    paths: [usr/local/bin/kubectl]
    statement: Upstream kubectl not rebuilt yet; latest release pinned.
    expired_at: 2026-12-31
  - id: CVE-2026-78669
    paths: [usr/local/bin/kubectl]
    statement: Upstream kubectl not rebuilt yet; latest release pinned.
    expired_at: 2026-12-31
  - id: CVE-2026-56851
    paths: [usr/local/bin/kubectl]
    statement: Upstream kubectl not rebuilt yet; latest release pinned.
    expired_at: 2026-12-31
