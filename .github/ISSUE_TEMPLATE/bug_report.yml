name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems do NOT go here: use **Security → Report a vulnerability** (see SECURITY.md).
        Remove tokens, hostnames and anything private from logs before pasting them.
  - type: input
    id: version
    attributes:
      label: Bayplan version
      description: Settings → Server, or the image tag.
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation
      options: [Single container, Helm chart, Docker Compose, Podman Quadlet, Other]
    validations:
      required: true
  - type: dropdown
    id: connector
    attributes:
      label: Cluster connector involved
      options: [Not cluster related, Local cluster, Agent, Direct, Cloud (EKS/AKS/GKE), Docker host]
  - type: input
    id: k8s
    attributes:
      label: Kubernetes version and distribution
      placeholder: 1.34, k3s
  - type: textarea
    id: what
    attributes:
      label: What happened and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: text
